name: WCAG 2.1 AA browser checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install browser accessibility testing
        run: |
          npm install --no-save --no-package-lock playwright axe-core
          npx playwright install --with-deps chromium webkit
      - name: Serve static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/shows-site.log 2>&1 &
          for n in $(seq 1 15); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0 || sleep 1; done
          echo "Local site did not start"; exit 1
      - name: Axe-core WCAG 2.1 AA across desktop and mobile
        env:
          SHOWS_PORTFOLIO: '1'
        run: node tests/accessibility.cjs

      - name: Mobile native date field fits all viewport widths
        run: node tests/shows-mobile-date.cjs
