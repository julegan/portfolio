name: Tubes v1 pattern and browser checks
on:
  pull_request:
    paths:
      - 'dist/projects/tubes/**'
      - 'tests/tubes*'
      - '.github/workflows/tubes.yml'
  push:
    branches: [main]
    paths:
      - 'dist/projects/tubes/**'
      - 'tests/tubes*'
      - '.github/workflows/tubes.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check deterministic knitting model
        run: node tests/tubes.test.mjs
      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock playwright axe-core
          npx playwright install --with-deps chromium
      - name: Serve portfolio
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/tubes-site.log 2>&1 &
          for n in $(seq 1 15); do curl -fsS http://127.0.0.1:4173/projects/tubes/ >/dev/null && exit 0 || sleep 1; done
          exit 1
      - name: Exercise controls and exports on desktop and mobile
        run: node tests/tubes-browser.cjs
