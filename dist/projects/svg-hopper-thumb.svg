<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="600" viewBox="0 0 1020 600" role="img" aria-labelledby="title desc">
  <title id="title">SVG Hopper graphic composer</title>
  <desc id="desc">A bone-colored artboard with editable letterforms, a Bezier curve and its control points, framed by a soft black composer with cool gray controls.</desc>
